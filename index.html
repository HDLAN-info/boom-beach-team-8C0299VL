<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2100">
<title>Boom Beach Team</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
@font-face {
  font-family: "Broshk";
  src: url("/fonts/broshk.ttf") format("truetype");
}

html, body {
  margin: 0;
  padding: 0;
  width: 2100px;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background: url("/img/noise.png") repeat, #f5edd1;
}

#team {
  width: 2100px;
  padding: 16px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.member {
  background: url("/img/noise.png") repeat, #e0d5b3;
  border-radius: 16px;
  padding: 2px 8px 2px 2px;
  display: grid;
  grid-template-columns: 124px 1fr 150px 180px;
  align-items: center;
  gap: 20px;
  height: 162px;
  box-shadow:
    inset 0 2px 0 #fff5d8,
    inset 0 -2px 0 rgba(0,0,0,0.10);
}

.level {
  width: 110px;
  height: 110px;
  background: url("/img/noise.png") repeat, #6fb6e5;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Broshk", sans-serif;
  font-size: 70px;
  font-weight: 700;
  color: #fff;
  border: 4px solid #2b5f8f;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0 4px 0 rgba(0,0,0,0.6);
  box-shadow:
    inset 0 6px 0 #a7d5f5,
    0 3px 0 rgba(0,0,0,0.10);
  margin-left: 14px;
}

.level.holiday {
  background: url("/img/noise.png") repeat, #7fdc8c;
  border-color: #2f7a46;
}

.name {
  font-size: 60px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  margin-top: -7px;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0 5px 0 rgba(0,0,0,0.6);
  cursor: pointer;
}

.role {
  font-size: 40px;
  font-weight: 600;
  color: #2a2a2a;
  margin-top: 6px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.10);
}

.qr, .qr-empty {
  width: 150px;
  height: 150px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.qr canvas {
  width: 146px !important;
  height: 146px !important;
}

.qr-badge {
  position: absolute;
  background: #000;
  color: #fff;
  font-weight: 900;
  font-size: 18px;
  padding: 6px 12px;
  border-radius: 10px;
}

.stats {
  font-size: 40px;
  font-weight: 600;
}

.icon {
  width: 60px;
  vertical-align: middle;
  margin-right: 10px;
}

.account-popup {
  position: fixed;
  background: #e0d5b3;
  border-radius: 16px;
  padding: 12px 24px;
  font-size: 48px;
  font-weight: 600;
  color: #fff;
  text-shadow: -2px -2px 0 #000;
  z-index: 9999;
}
</style>
</head>

<body>

<div id="team">Načítám…</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqE6PF33q7CNxxCxsS26B7gHSQui6Sw2sJtuFt_cJsWfqADrxVqnTTsRS9XVSNqWyZnJqVS6GhuwOk/pub?output=csv";

const medalIcon = "/img/medal.webp";
const intelIcon = "/img/intel.webp";

function clean(v) {
  return (v || "").trim();
}

function roleColor(role) {
  role = role.toLowerCase();
  if (role === "leader") return "#ffcb20";
  if (role === "co-leader") return "#d9fbb2";
  if (role === "officer") return "#bbd7d8";
  return "#fff";
}

function isTrue(v) {
  return String(v).toUpperCase() === "TRUE";
}

Papa.parse(url, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {

    const players = results.data.map(row => ({
      name: clean(row.name),
      level: clean(row.level),
      role: clean(row.role),
      medals: clean(row.vp),
      tickets: clean(row.intels),
      qr: clean(row.qr),
      holiday: clean(row.holiday),
      accounts: clean(row.accounts)
    })).filter(p => p.name);

    players.sort((a,b)=>Number(b.medals)-Number(a.medals));

    const team = document.getElementById("team");
    team.innerHTML = "";

    players.forEach(p=>{
      const el = document.createElement("div");
      el.className="member";

      el.innerHTML=`
        <div class="level ${isTrue(p.holiday)?"holiday":""}">${p.level}</div>
        <div>
          <div class="name" style="color:${roleColor(p.role)}">${p.name}</div>
          <div class="role">${p.role}</div>
        </div>
        ${p.qr?`<a class="qr" data-link="${p.qr}"><div class="qr-badge">ID</div></a>`:`<div class="qr-empty"></div>`}
        <div class="stats">
          <div><img class="icon" src="${medalIcon}">${p.medals}</div>
          <div><img class="icon" src="${intelIcon}">${p.tickets}</div>
        </div>
      `;
      team.appendChild(el);
    });

    setTimeout(()=>{
      document.querySelectorAll(".qr").forEach(el=>{
        new QRCode(el,{text:el.dataset.link,width:146,height:146});
      });
    },50);

    autoShrinkNames();
  }
});

function autoShrinkNames(){
  document.querySelectorAll(".name").forEach(el=>{
    let size=60;
    while(el.scrollWidth>el.clientWidth && size>28){
      size--;
      el.style.fontSize=size+"px";
    }
  });
}
</script>

</body>
</html>
