<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2100">
<title>Boom Beach Team</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>
@font-face {
  font-family: "Broshk";
  src: url("fonts/broshk.ttf") format("truetype");
}

html, body {
  margin: 0;
  padding: 0;
  width: 2100px;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    url("img/noise.png") repeat,
    #f5edd1;
}

#team {
  width: 2100px;
  padding: 0 16px 16px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.member {
  background:
    url("img/noise.png") repeat,
    #e0d5b3;
  border-radius: 16px;
  padding: 2px 8px 2px 2px;
  display: grid;
  grid-template-columns: 124px 1fr 150px 180px;
  align-items: center;
  gap: 20px;
  height: 162px;
  box-shadow:
    inset 0 2px 0 #fff5d8,
    inset 0 -2px 0 rgba(0,0,0,0.10);
}

.level {
  width: 110px;
  height: 110px;
  background:
    url("img/noise.png") repeat,
    #6fb6e5;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Broshk", sans-serif;
  font-size: 70px;
  font-weight: 700;
  color: #fff;
  border: 4px solid #2b5f8f;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0 4px 0 rgba(0,0,0,0.6);
  box-shadow:
    inset 0 6px 0 #a7d5f5,
    0 3px 0 rgba(0,0,0,0.10);
  margin-left: 14px;
}

.level.holiday {
  background:
    url("img/noise.png") repeat,
    #7fdc8c;
  border-color: #2f7a46;
  box-shadow:
    inset 0 6px 0 #bdf0c7,
    0 3px 0 rgba(0,0,0,0.10);
}

.name {
  font-size: 60px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1;
   white-space: nowrap;
  margin-top: -7px;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0 5px 0 rgba(0,0,0,0.6);
}

.role {
  font-size: 40px;
  font-weight: 600;
  color: #2a2a2a;
  margin-top: 6px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.10);
  display: flex;
  align-items: center;
  gap: 10px;
}

.session-icon {
  width: 32px;
  height: 32px;
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center;
  opacity: 0;
}

.session-icon.active {
  background-image: url("img/session.webp");
  opacity: 1;
}

.qr, .qr-empty {
  width: 150px;
  height: 150px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.qr canvas {
  width: 146px !important;
  height: 146px !important;
  image-rendering: pixelated;
}

.qr-logo {
  position: absolute;
  width: 56px;
  height: 56px;
  background: url("/img/boombeach-logo.png") center/contain no-repeat;
  pointer-events: none;
}

.stats {
  font-size: 40px;
  font-weight: 600;
  color: #111;
}

.stats div {
  margin: 8px 0;
}

.icon {
  width: 60px;
  vertical-align: middle;
  margin-right: 10px;
}

.intel {
  transform: translateY(-5px);
}

.qr {
  cursor: pointer;
  text-decoration: none;
}
.account-name {
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.08s ease;
}

.account-name:hover {
  transform: scale(1.03);
  filter: brightness(1.15);
}
  
.account-name:hover {
  transform: scale(1.03);
  filter: brightness(1.15);
}

/* 👇 MUSÍ být pořád uvnitř style */

.account-popup {
  position: fixed;
  background:
    url("img/noise.png") repeat,
    #e0d5b3;
  border-radius: 16px;
  padding: 12px 24px;
  box-shadow:
    inset 0 2px 0 #fff5d8,
    inset 0 -2px 0 rgba(0,0,0,0.10),
    0 10px 30px rgba(0,0,0,0.25);
  z-index: 9999;
  font-size: 48px;
  font-weight: 600;
  color: #fff;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
  white-space: nowrap;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px);
  overflow: auto;
  box-sizing: border-box;
  pointer-events: none;
  animation: popupFade 0.15s ease-out;
}

@keyframes popupFade {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.stat-history { cursor: pointer; border-radius: 12px; transition: background-color .15s ease, transform .15s ease; user-select: none; }
.stat-history:hover, .stat-history:focus-visible { background: rgba(255,255,255,.35); transform: scale(1.03); outline: none; }
.history-popup { position: fixed; width: min(820px, calc(100vw - 48px)); height: 500px; padding: 22px 26px 26px; box-sizing: border-box; background: url("img/noise.png") repeat, #e0d5b3; border: 3px solid rgba(43,95,143,.65); border-radius: 20px; box-shadow: 0 14px 45px rgba(0,0,0,.38), inset 0 2px 0 #fff5d8; z-index: 10000; display: none; }
.history-popup.visible { display: block; }
.history-title { margin: 0 45px 12px 0; font-size: 30px; line-height: 1.15; color: #1c2730; }
.history-close { position: absolute; top: 10px; right: 14px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.55); font-size: 32px; line-height: 40px; cursor: pointer; }
.history-chart-wrap { height: 405px; }
.history-message { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: #333; text-align: center; }

.team-header {
  position: relative;
  width: 2100px;
  margin: 0;
  line-height: 0;
  overflow: hidden;
}

.team-header-image {
  display: block;
  width: 100%;
  height: auto;
}

.team-info-value {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  right: calc(15.75% - 1px);
  box-sizing: border-box;
  padding: 0;
  background: transparent;
  color: #2b2b31;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 34px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  white-space: nowrap;
  text-align: right;
  text-shadow: 0 1px 0 rgba(255,255,255,.3);
}


.team-join-link {
  position: absolute;
  left: 85.9%;
  top: 24.7%;
  width: 12.8%;
  height: 14.6%;
  display: block;
  cursor: pointer;
  border-radius: 8px;
}

.team-join-link:focus-visible {
  outline: 4px solid #fff;
  outline-offset: -5px;
}
.team-info-force { top: 26.3%; width: 5.70%; height: 6.7%; }
.team-info-intels { top: 38.0%; width: 4.25%; height: 6.7%; }
.team-info-tag { top: 49.6%; width: 10.15%; height: 6.7%; }
.team-info-members { top: calc(61.2% + 1px); width: 5.85%; height: 6.7%; font-size: 34px; font-weight: 900; }
.team-info-entry { top: 72.9%; width: 3.25%; height: 6.7%; }
.team-info-type { top: 84.3%; width: 5.45%; height: 6.7%; }
.last-update {
  width: 2100px;
  box-sizing: border-box;
  padding: 4px 20px 24px;
  text-align: center;
  color: #fff;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 32px;
  font-weight: 600;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0 5px 0 rgba(0,0,0,0.6);
}
</style>
  
</head>

<body>

<div class="team-header" aria-label="Informace o týmu">
  <img class="team-header-image" src="img/team-header.png?v=20260814-3" alt="CZECH task force">
  <a class="team-join-link" href="https://link.boombeach.com/?url=boombeach%3A%2F%2FViewTaskforce%3Ftag%3D%23PV9LJUQ2" aria-label="Join CZECH task force"></a>
  <span class="team-info-value team-info-force" data-team-info="force_points">41&#8239;743</span>
  <span class="team-info-value team-info-intels" data-team-info="intels_per_day">1&#8239;935</span>
  <span class="team-info-value team-info-tag" data-team-info="tag">#PV9LJUQ2</span>
  <span class="team-info-value team-info-members" data-team-info="members">50/50</span>
  <span class="team-info-value team-info-entry" data-team-info="entry_requirement">1&#8239;200</span>
  <span class="team-info-value team-info-type" data-team-info="type">Closed</span>
</div>
<div id="team">Načítám…</div>
<div class="last-update">Last update: <span id="lastUpdateValue"></span></div>
<div id="historyPopup" class="history-popup" role="dialog" aria-modal="false" aria-labelledby="historyTitle">
  <button class="history-close" type="button" aria-label="Zavřít">&times;</button>
  <h2 id="historyTitle" class="history-title"></h2>
  <div class="history-chart-wrap"><canvas></canvas></div>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqE6PF33q7CNxxCxsS26B7gHSQui6Sw2sJtuFt_cJsWfqADrxVqnTTsRS9XVSNqWyZnJqVS6GhuwOk/pub?output=csv";

const historyUrls = { intel: url + "&gid=1591390740", vp: url + "&gid=890280555" };
const teamInfoUrl = url + "&gid=861518513";
const lastUpdateUrl = "https://docs.google.com/spreadsheets/d/1QwQtftNvKBuVT1hTVxgilxiUdDT_D1OEhA8ILINs0Wo/gviz/tq?tqx=out:csv&sheet=TEAM%20INFO&range=B6";

const medalIcon = "img/medal.webp";
const intelIcon = "img/intel.webp";

function clean(v) {
  return (v || "").trim().replace(/^"+|"+$/g, "");
}

function parseCSVRow(row) {
  const result = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < row.length; i++) {
    const char = row[i];
    if (char === '"') inQuotes = !inQuotes;
    else if (char === "," && !inQuotes) {
      result.push(current);
      current = "";
    } else current += char;
  }
  result.push(current);
  return result;
}


function normalizeTeamInfoKey(value) {
  return clean(value).toLowerCase().replace(/[^a-z]/g, "");
}

function formatTeamNumber(value) {
  const number = Number(String(value).replace(/\s/g, ""));
  return Number.isFinite(number) ? new Intl.NumberFormat("cs-CZ").format(number).replace(/\s/g, "\u202F") : value;
}

fetch(teamInfoUrl)
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(text => {
    const values = new Map(
      text.trim().split(/\r?\n/).map(row => {
        const columns = parseCSVRow(row);
        return [normalizeTeamInfoKey(columns[0]), clean(columns[1])];
      })
    );

    const mappings = {
      force_points: ["forcepoints", true],
      intels_per_day: ["intelsperday", true],
      tag: ["tag", false],
      members: ["members", false],
      entry_requirement: ["entryregurement", true],
      type: ["type", false]
    };

    Object.entries(mappings).forEach(([target, [source, numeric]]) => {
      const value = values.get(source);
      const element = document.querySelector(`[data-team-info="${target}"]`);
      if (element && value !== undefined && value !== "") {
        const displayValue = target === "members" ? `${value.split("/")[0]}/50` : value;
        element.textContent = numeric ? formatTeamNumber(displayValue) : displayValue;
      }
    });
  })
  .catch(error => console.error("Team info load failed", error));
fetch(lastUpdateUrl)
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(text => {
    const value = clean(parseCSVRow(text.trim())[0]);
    if (value) document.getElementById("lastUpdateValue").textContent = value.replace(/(\d{1,2}:\d{2}):\d{2}\b/, "$1");
  })
  .catch(error => console.error("Last update load failed", error));
function roleColor(role) {
  const r = role.toLowerCase();
  if (r === "leader") return "#ffcb20";
  if (r === "co-leader") return "#d9fbb2";
  if (r === "officer") return "#bbd7d8";
  if (r === "member") return "#ffffff";
  return "#ff5e5e";
}

function isTrue(v) {
  return String(v).trim().toUpperCase() === "TRUE";
}

fetch(url)
.then(r => r.text())
.then(text => {
  const rows = text.trim().split("\n");
  const header = parseCSVRow(rows[0]).map(h => clean(h).toLowerCase());
  const idx = n => header.indexOf(n);

  const players = rows.slice(1, 51).map(row => {
    const c = parseCSVRow(row);
    return {
      name: clean(c[idx("name")]),
      tag: clean(c[idx("tag")]),
      level: clean(c[idx("level")]),
      role: clean(c[idx("role")]),
      medals: clean(c[idx("vp")]),
      tickets: clean(c[idx("intels")]),
      qr: clean(c[idx("qr")]),
      holiday: clean(c[idx("holiday")]),
      session: clean(c[idx("session")]),
      accounts: clean(c[idx("accounts")])
    };
  }).filter(p => p.name !== "");

  players.sort((a, b) => Number(b.medals) - Number(a.medals));
  const team = document.getElementById("team");
  team.innerHTML = "";

  players.forEach(p => {
    const el = document.createElement("div");
    el.className = "member";
    const hasQR = p.qr !== "";

    el.innerHTML = `
      <div class="level ${isTrue(p.holiday) ? "holiday" : ""}">${p.level}</div>
      <div>
        <div class="name account-name"
     data-main="${p.name}"
     data-accounts="${p.accounts}" style="color:${roleColor(p.role)}">${p.name}</div>
        <div class="role">
          <span class="session-icon ${isTrue(p.session) ? "active" : ""}"></span>
          ${p.role}
        </div>
      </div>
      ${hasQR ? `
<a class="qr" href="${p.qr}" data-link="${p.qr}">
  <div class="qr-logo"></div>
</a>
      ` : `<div class="qr-empty"></div>`}
      <div class="stats">
        <div class="stat-history" tabindex="0" role="button" data-kind="vp" data-tag="${p.tag}" data-player="${p.name}"><img class="icon" src="${medalIcon}">${p.medals}</div>
        <div class="stat-history" tabindex="0" role="button" data-kind="intel" data-tag="${p.tag}" data-player="${p.name}"><img class="icon intel" src="${intelIcon}">${p.tickets}</div>
      </div>
    `;
    team.appendChild(el);
  });

  setTimeout(() => {
    document.querySelectorAll(".qr").forEach(el => {
      new QRCode(el, {
        text: el.dataset.link,
        width: 146,
        height: 146,
        colorDark: "#000",
        colorLight: "#e0d5b3",
        correctLevel: QRCode.CorrectLevel.H
      });
    });
  }, 50);
    setTimeout(autoShrinkNames, 100);
});

  
function autoShrinkNames() {
  document.querySelectorAll(".name").forEach(el => {
    let size = 60;
    el.style.fontSize = size + "px";

    while (el.scrollWidth > el.clientWidth && size > 28) {
      size--;
      el.style.fontSize = size + "px";
    }
  });
} // 👈 funkce končí TADY


// 👇 popup kód je MIMO funkci

let popup = null;

function showAccounts(el) {
  hidePopup();

  const main = el.dataset.main;
  const extra = el.dataset.accounts.trim();

  if (!extra) return;

  const list = [main, ...extra.split(", ").filter(a => a)];

  popup = document.createElement("div");
  popup.className = "account-popup";
  popup.innerHTML = list.join("<br>");

  document.body.appendChild(popup);

  const rect = el.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  const margin = 12;
  const gap = 10;
  const left = Math.max(margin, Math.min(rect.left, window.innerWidth - popupRect.width - margin));

  let top = rect.bottom + gap;
  if (top + popupRect.height > window.innerHeight - margin) {
    top = rect.top - popupRect.height - gap;
  }
  top = Math.max(margin, Math.min(top, window.innerHeight - popupRect.height - margin));

  popup.style.left = left + "px";
  popup.style.top = top + "px";
}

function hidePopup() {
  if (popup) {
    popup.remove();
    popup = null;
  }
}

document.addEventListener("click", e => {
  const el = e.target.closest(".account-name");
  if (el) showAccounts(el);
  else hidePopup();
});

window.addEventListener("scroll", hidePopup);
window.addEventListener("touchmove", hidePopup);


const historyPopup = document.getElementById("historyPopup");
const historyTitle = document.getElementById("historyTitle");
const historyCache = {};
let historyChart = null, historyCloseTimer = null, historyPinned = false;
const weekendBackgroundPlugin = {
  id: "weekendBackground",
  beforeDraw(chart, args, options) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x || !options.days) return;

    ctx.save();
    options.days.forEach((day, i) => {
      if (day !== 0 && day !== 6) return;
      const right = Math.min(chartArea.right, scales.x.getPixelForValue(i));
      const left = i > 0
        ? Math.max(chartArea.left, scales.x.getPixelForValue(i - 1))
        : chartArea.left;
      ctx.fillStyle = day === 6 ? "rgba(255, 214, 64, 0.18)" : "rgba(235, 80, 80, 0.14)";
      ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
    });
    ctx.restore();
  }
};

function parseHistory(text) {
  const rows = text.trim().split(/\r?\n/).map(parseCSVRow);
  const labels = rows[0].slice(2).map(clean), byTag = new Map();
  rows.slice(1).forEach(c => {
    const recentValues = c.slice(2).map(raw => ({ raw: clean(raw), value: Number(clean(raw)) })).filter(p => p.raw !== "" && Number.isFinite(p.value)).slice(-30);
    const points = recentValues.map((point, i) => {
      const daysAgo = recentValues.length - i;
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() - daysAgo);
      return {
        ...point,
        label: daysAgo === 1 ? "Včera" : `${daysAgo} d.`,
        dayOfWeek: date.getDay()
      };
    });
    byTag.set(clean(c[1]).toUpperCase(), points);
  });
  return byTag;
}

async function loadHistory(kind) {
  if (!historyCache[kind]) historyCache[kind] = fetch(historyUrls[kind]).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }).then(parseHistory).catch(error => { delete historyCache[kind]; throw error; });
  return historyCache[kind];
}

function positionHistoryPopup(anchor) {
  const rect = anchor.getBoundingClientRect(), width = Math.min(820, window.innerWidth - 48), height = 500;
  let left = rect.right + 18;
  if (left + width > window.innerWidth - 24) left = rect.left - width - 18;
  historyPopup.style.left = `${Math.max(24, Math.min(left, window.innerWidth - width - 24))}px`;
  historyPopup.style.top = `${Math.max(24, Math.min(rect.top - 160, window.innerHeight - height - 24))}px`;
}

async function showHistory(anchor, pin = false) {
  clearTimeout(historyCloseTimer); historyPinned = pin; historyPopup.classList.add("visible"); positionHistoryPopup(anchor);
  const kind = anchor.dataset.kind, wrap = historyPopup.querySelector(".history-chart-wrap");
  historyTitle.textContent = `${anchor.dataset.player} – ${kind === "vp" ? "VP" : "intely"} za posledních 30 dnů`;
  wrap.innerHTML = '<div class="history-message">Načítám historii…</div>';
  try {
    const points = (await loadHistory(kind)).get(anchor.dataset.tag.toUpperCase()) || [];
    if (!points.length) { wrap.innerHTML = '<div class="history-message">Pro tohoto hráče zatím není historie k dispozici.</div>'; return; }
    wrap.innerHTML = '<canvas></canvas>';
    if (historyChart) historyChart.destroy();
    historyChart = new Chart(wrap.querySelector("canvas"), {
      type: "line",
      plugins: [weekendBackgroundPlugin],
      data: {
        labels: points.map(p => p.label),
        datasets: [{
          data: points.map(p => p.value),
          borderColor: kind === "vp" ? "#d59b00" : "#1687c4",
          backgroundColor: kind === "vp" ? "rgba(213,155,0,.18)" : "rgba(22,135,196,.18)",
          fill: true,
          tension: .25,
          pointRadius: points.length < 40 ? 4 : 0,
          pointHoverRadius: 7,
          borderWidth: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: "index" },
        plugins: {
          legend: { display: false },
          weekendBackground: { days: points.map(p => p.dayOfWeek) }
        },
        scales: {
          x: { ticks: { font: { size: 16 }, maxTicksLimit: 10 } },
          y: { ticks: { font: { size: 16 }, precision: 0 } }
        }
      }
    });
  } catch (error) { wrap.innerHTML = '<div class="history-message">Historii se nepodařilo načíst. Zkuste to prosím znovu.</div>'; console.error(error); }
}

function closeHistory(force = false) { if (historyPinned && !force) return; historyPopup.classList.remove("visible"); historyPinned = false; }
function scheduleHistoryClose() { clearTimeout(historyCloseTimer); historyCloseTimer = setTimeout(closeHistory, 250); }
document.addEventListener("mouseover", e => { const stat = e.target.closest(".stat-history"); if (stat && !stat.contains(e.relatedTarget) && matchMedia("(hover: hover)").matches) showHistory(stat); });
document.addEventListener("mouseout", e => { const stat = e.target.closest(".stat-history"); if (stat && !stat.contains(e.relatedTarget)) scheduleHistoryClose(); });
document.addEventListener("click", e => { const stat = e.target.closest(".stat-history"); if (stat) { e.stopPropagation(); showHistory(stat, true); } else if (!e.target.closest(".history-popup")) closeHistory(true); });
document.addEventListener("keydown", e => { const stat = e.target.closest(".stat-history"); if (stat && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showHistory(stat, true); } if (e.key === "Escape") closeHistory(true); });
historyPopup.addEventListener("mouseenter", () => clearTimeout(historyCloseTimer));
historyPopup.addEventListener("mouseleave", scheduleHistoryClose);
historyPopup.querySelector(".history-close").addEventListener("click", () => closeHistory(true));
window.addEventListener("resize", () => closeHistory(true));</script>
